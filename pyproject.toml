[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "new-algo-trader"
version = "0.1.0"
description = "Algorithmic-trading platform for intraday Indian equities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1,<2",
    "polars>=1,<2",
    "pydantic>=2,<3",
    "pyarrow>=25,<26",
    "TA-Lib>=0.7,<0.8",
    "tzdata>=2025.2",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
