[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "new-algo-trader"
version = "0.1.0"
description = "Algorithmic-trading platform for intraday Indian equities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "APScheduler>=3.11.3,<4",
    "duckdb>=1,<2",
    "lightgbm>=4.7,<5",
    "logzero>=1.7,<2",
    "matplotlib>=3.11,<4",
    "openpyxl>=3.1,<4",
    "optuna>=4.9,<5",
    "polars>=1,<2",
    "pydantic>=2,<3",
    "pyarrow>=25,<26",
    "pyotp>=2.10,<3",
    "python-dotenv>=1.2.2,<2",
    "scikit-learn>=1.9,<2",
    "smartapi-python==1.5.5",
    "TA-Lib>=0.7,<0.8",
    "tzdata>=2025.2",
    "websocket-client>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
